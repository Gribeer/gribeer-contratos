<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="robots" content="noindex, nofollow">
<title>GriBeer · Contratos</title>
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<style>
:root{
  --bg:#080808;--surface:#111;--card:#181818;--border:#262626;--accent:#F5A623;--accent-dim:#F5A62318;
  --green:#4CAF82;--green-dim:#4CAF8218;--red:#E05252;--red-dim:#E0525218;--blue:#5B9CF6;--blue-dim:#5B9CF618;
  --text:#F0F0F0;--muted:#8a8a8a;--dim:#2A2A2A;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:12px;padding:6px 0 14px}
header img{width:42px;height:42px;border-radius:10px;object-fit:cover}
header .t{font-weight:800;font-size:16px}
header .s{font-size:12px;color:var(--muted)}
header .draft{margin-left:auto;background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px}
.meta b{color:var(--accent)}
.bar{height:4px;background:var(--border);border-radius:3px;margin-bottom:20px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
h2{font-size:19px;margin:0 0 6px}
.hint{font-size:13px;color:var(--muted);margin:0 0 16px;line-height:1.45}
label.l{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:0 0 5px}
.f{margin-bottom:14px}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=time],input[type=number],select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 14px;color:var(--text);font-size:16px;outline:none;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input.bad{border-color:var(--red)}
textarea{min-height:110px;resize:vertical}
input[type=date]{color-scheme:dark}
.err{color:var(--red);font-size:12px;margin-top:5px;min-height:1em}
.ok-msg{color:var(--green);font-size:12px;margin-top:5px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--border);border-radius:12px;padding:15px;color:var(--text);font-size:15px;font-weight:700;cursor:pointer;margin-bottom:10px;font-family:inherit}
.opt small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.opt.on{border-color:var(--accent);background:var(--accent-dim);color:var(--accent)}
.opt .ic{font-size:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{background:none;border:1px solid var(--border);color:var(--text);border-radius:999px;padding:9px 14px;font-size:14px;cursor:pointer;font-family:inherit}
.chip.on{border-color:var(--accent);background:var(--accent-dim);color:var(--accent);font-weight:700}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.eqrow{display:grid;grid-template-columns:1fr 120px 36px;gap:8px;align-items:center;margin-bottom:8px}
.eqrow .n{font-size:14px}
.qty{display:flex;align-items:center;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.qty button{background:var(--surface);border:none;color:var(--accent);width:36px;height:40px;font-size:18px;cursor:pointer}
.qty span{flex:1;text-align:center;font-weight:700}
.x{background:var(--red-dim);color:var(--red);border:none;border-radius:8px;height:36px;cursor:pointer;font-size:14px}
.brow{display:grid;grid-template-columns:90px 1fr 36px;gap:8px;margin-bottom:8px}
.sec{font-size:11px;color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:.8px;margin:6px 0 8px}
.btn-s{background:var(--accent-dim);color:var(--accent);border:none;border-radius:8px;padding:9px 14px;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit}
.btn-red{background:var(--red-dim);color:var(--red)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.nav button{border-radius:12px;padding:14px 18px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
.back{background:none;border:1px solid var(--border);color:var(--muted)}
.next{background:var(--accent);border:none;color:#000;flex:1}
.next:disabled{background:var(--dim);color:var(--muted);cursor:default}
.sig{position:relative}
.sig canvas{display:block;width:100%;height:190px;background:#fff;border-radius:12px;border:2px solid var(--border);touch-action:none}
.sig.has canvas{border-color:var(--green)}
.sig .ph{position:absolute;left:0;right:0;top:80px;text-align:center;color:#bbb;font-size:14px;pointer-events:none}
.sig.has .ph{display:none}
.cond{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;font-size:13px;line-height:1.55;color:#cfcfcf;max-height:44vh;overflow:auto;white-space:pre-line}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:0}
.sum{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px 14px;font-size:14px}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #222}
.sum div:last-child{border-bottom:none}
.sum span:first-child{color:var(--muted)}
.sum span:last-child{text-align:right;max-width:62%;word-break:break-word}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.photos figure{margin:0;position:relative}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.photos button{position:absolute;top:4px;right:4px;background:#000a;color:#fff;border:none;border-radius:50%;width:26px;height:26px;cursor:pointer}
.upl{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--blue-dim);color:var(--blue);border:1px dashed #5B9CF660;border-radius:12px;padding:18px;font-size:15px;font-weight:700;cursor:pointer}
.status{border-radius:12px;padding:14px;margin-bottom:12px;font-size:14px;line-height:1.45}
.status.ok{background:var(--green-dim);border:1px solid #4CAF8250;color:var(--green)}
.status.ko{background:var(--red-dim);border:1px solid #E0525250;color:var(--red)}
.status.info{background:var(--blue-dim);border:1px solid #5B9CF650;color:var(--blue)}
.big{display:block;width:100%;border-radius:12px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;border:none;margin-bottom:10px;text-align:center;text-decoration:none;font-family:inherit}
.big.a{background:var(--accent);color:#000}
.big.b{background:var(--blue-dim);color:var(--blue);border:1px solid #5B9CF640}
.big.c{background:none;color:var(--muted);border:1px solid var(--border)}
.big:disabled{opacity:.6;cursor:default}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #0004;border-top-color:#000;border-radius:50%;animation:s 1s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
details.cat{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:8px}
details.cat summary{padding:13px 14px;font-weight:700;font-size:14px;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.cat summary::-webkit-details-marker{display:none}
details.cat summary::after{content:"▾";color:var(--muted)}
details.cat[open] summary::after{content:"▴"}
details.cat summary span{margin-left:auto;margin-right:8px;color:var(--accent)}
details.cat .chips{padding:0 12px 12px;margin:0}
footer{text-align:center;color:#555;font-size:11px;padding:18px 0 30px}
.pend{background:var(--accent-dim);border:1px solid #F5A62340;color:var(--accent);border-radius:12px;padding:12px;font-size:13px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="logo.jpg" alt="GriBeer">
    <div><div class="t">GriBeer · Contratos</div><div class="s">Entrega de equipos con firma</div></div>
    <button class="draft" id="resetBtn" title="Empezar de cero">Nuevo</button>
  </header>
  <div id="pending"></div>
  <main class="card" id="app"></main>
  <footer>GRIBEER EVENTOS S.L. · CIF B10628956 · info@gribeer.com</footer>
</div>
<script src="jspdf.umd.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
